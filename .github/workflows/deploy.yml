on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-central-1
  AWS_S3_BUCKET: dawid-portfolio
  CLOUDFRONT_DISTRIBUTION_ID: E1X6GU32YTVBQ3

jobs:
  Validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      #HTML/CSS validation
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: "."
          extra: "--skip-non-html"

      - name: Validate links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress "./**/*.html" --timeout 5

      - name: Validate CSS
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: "css/"
          css: true

      #Python validation
      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check . --select ALL --ignore D203,D212,INP001,CPY001

      - name: Check Ruff Formatting
        run: 
          ruff format --check .

  Update_Last_updated:
    runs-on: ubuntu-latest
    needs: Validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Update Script
        run: |
          python scripts/update_last_update.py

      - name: Create Artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-html-css
          path: |
            index.html
            css/
          if-no-files-found: error

  Deploy:
    runs-on: ubuntu-latest
    needs: Update_Last_updated
    permissions:
      id-token: write
      contents: read

    steps:      
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: website-html-css
          path: website

      - name: Debug OIDC token claims
        run: |
          oidc_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          echo "$oidc_response" | jq '{token_type, expires_in, value: "[REDACTED]"}'

          jwt=$(echo "$oidc_response" | jq -r '.value')
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "OIDC response did not contain a JWT"
            exit 1
          fi

          jwt_payload=$(echo "$jwt" | cut -d '.' -f 2 | tr '_-' '/+')
          case $((${#jwt_payload} % 4)) in
            2) jwt_payload="${jwt_payload}==" ;;
            3) jwt_payload="${jwt_payload}=" ;;
          esac

          echo "JWT header:"
          echo "$jwt" | cut -d '.' -f 1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .
          echo "JWT claims:"
          echo "$jwt_payload" | base64 -d 2>/dev/null | jq .

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sync files to S3
        run: |
          aws s3 sync website/ s3://${{ env.AWS_S3_BUCKET }} --delete

      - name: invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
      #- aws S3 sync
      #- CloudFront Invalidation
